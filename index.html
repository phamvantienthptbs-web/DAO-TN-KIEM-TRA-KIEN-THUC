<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo đề & Ôn luyện trắc nghiệm</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<style>
:root{--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--bg:#f1f5f9;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
.hide{display:none!important}
/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#ec4899)}
.lbox{background:#fff;border-radius:22px;padding:38px 32px 28px;width:100%;max-width:410px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.lbox .ic{font-size:52px}
.lbox h1{margin:6px 0 4px;font-size:22px}
.lbox p{margin:0 0 22px;color:var(--mut);font-size:14px}
input[type=password]{width:100%;padding:13px 16px;border:2px solid var(--bd);border-radius:12px;font-size:16px;outline:none;transition:.15s}
input[type=password]:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.copy{margin-top:18px;font-size:13px;color:var(--mut)}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;font:600 15px inherit;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,70,229,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri);padding:9px 16px}
.btn.gr{background:linear-gradient(135deg,#16a34a,#059669)}
.lbox .btn{width:100%;margin-top:14px}
/* App */
header{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 14px rgba(15,23,42,.1);padding:12px 18px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:19px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
.info{font-size:14px;color:var(--mut)}
.prog{height:6px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .4s}
main{max-width:860px;margin:18px auto;padding:0 14px 30px}
.q{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,23,42,.06);scroll-margin-top:190px}
.qh{font-weight:700;color:var(--pri);margin-bottom:6px}
.st{font-size:17px;margin-bottom:14px}
.os{display:grid;gap:10px}
.o{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;background:#fff;font:inherit;color:inherit;cursor:pointer;transition:.15s}
.o:hover:not(:disabled){border-color:var(--pri);background:#eef2ff}
.o .l{flex:none;width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:var(--pri);display:grid;place-items:center;font-weight:700}
.o.ok{border-color:var(--ok);background:var(--okbg)}.o.ok .l{background:var(--ok);color:#fff}
.o.bad{border-color:var(--bad);background:var(--badbg)}.o.bad .l{background:var(--bad);color:#fff}
.o:disabled{cursor:default}
.fb{margin-top:10px;font-weight:600}
.fb.good{color:var(--ok)}.fb.no{color:var(--bad)}.fb.warn{color:#b45309}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 0 26px}
</style>
</head>
<body>

<!-- ĐĂNG NHẬP -->
<div id="login">
  <form class="lbox" id="lf">
    <div class="ic">🔐</div>
    <h1>Phần mềm Đảo đề Trắc nghiệm</h1>
    <p>Vui lòng nhập mật khẩu để tiếp tục</p>
    <input type="password" id="pw" placeholder="Nhập mật khẩu..." autocomplete="current-password" autofocus>
    <div class="err" id="err"></div>
    <button class="btn" type="submit">Đăng nhập</button>
    <div class="copy">Bản quyền thuộc về số ĐT: 0943930787</div>
  </form>
</div>

<!-- ỨNG DỤNG -->
<div id="app" class="hide">
  <header>
    <div class="top"><h1>📝 Đảo đề trắc nghiệm</h1><button class="btn sec" id="out">Đăng xuất</button></div>
    <div class="bar">
      <label class="btn" for="file">📂 Tải file Docx đề gốc</label>
      <input type="file" id="file" accept=".docx" hidden>
      <button class="btn" id="shuf" disabled>🔀 Đảo đề</button>
      <button class="btn gr" id="exp" disabled>⬇️ Xuất file Docx</button>
    </div>
    <div class="info" id="info"></div>
    <div class="prog"><i id="pb"></i></div>
  </header>
  <main id="list"></main>
  <footer>Bản quyền thuộc về số ĐT: 0943930787</footer>
</div>

<script>
const PW='huongson28011981';
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Đăng nhập (sessionStorage: tắt tab là phải đăng nhập lại) ---------- */
function gate(){
  const ok=sessionStorage.getItem('auth')==='1';
  $('login').classList.toggle('hide',ok);
  $('app').classList.toggle('hide',!ok);
}
$('lf').onsubmit=e=>{
  e.preventDefault();
  if($('pw').value===PW){sessionStorage.setItem('auth','1');$('pw').value='';$('err').textContent='';gate()}
  else{$('err').textContent='Mật khẩu không đúng, vui lòng thử lại!';$('pw').select()}
};
$('out').onclick=()=>{sessionStorage.removeItem('auth');gate()};
gate();

/* ---------- Đọc file Word ---------- */
let orig=[],cur=[],code=0,name='',tries=0;

// Chuyển HTML của mammoth thành chuỗi T + mảng cờ định dạng F (1=gạch chân, 2=đậm, 4=nghiêng)
function flatten(html){
  const d=new DOMParser().parseFromString(html,'text/html');let T='';const F=[];
  const add=(s,f)=>{for(let k=0;k<s.length;k++){T+=s[k];F.push(f)}};
  (function w(n,f){
    if(n.nodeType===3)return add(n.nodeValue.normalize('NFC').replace(/[\r\n\u00a0]+/g,' '),f);
    if(n.nodeType!==1)return;
    const t=n.tagName;let g=f;
    if(t==='U')g|=1;else if(t==='STRONG'||t==='B')g|=2;else if(t==='EM'||t==='I')g|=4;
    if(t==='BR')return add('\n',0);
    if(t==='TD'||t==='TH')add(' ',0);
    n.childNodes.forEach(c=>w(c,g));
    if(/^(P|LI|TR|H[1-6]|DIV)$/.test(t))add('\n',0);
  })(d.body,0);
  return{T,F};
}
function mk(T,F,a,b){ // tạo danh sách "run" (đoạn cùng định dạng), đã cắt khoảng trắng 2 đầu
  while(a<b&&/\s/.test(T[a]))a++;while(b>a&&/\s/.test(T[b-1]))b--;
  const r=[];for(let i=a;i<b;i++){const l=r[r.length-1];if(l&&l.f===F[i])l.t+=T[i];else r.push({t:T[i],f:F[i]})}
  return r;
}
function ratio(T,F,a,b){let u=0,n=0;for(let i=a;i<b;i++){if(/\s/.test(T[i]))continue;n++;if(F[i]&1)u++}return n?u/n:0}

function parse(T,F){
  const re=/(?:^|\n)[ \t]*(?:câu|question)\s*\d+\s*[.:)]?[ \t]*/gi,ms=[...T.matchAll(re)],out=[];
  ms.forEach((m,k)=>{
    const s=m.index+m[0].length,e=k+1<ms.length?ms[k+1].index:T.length,seg=T.slice(s,e),P=[];let p=0;
    for(const L of 'ABCD'){ // tìm lần lượt nhãn A. B. C. D.
      const x=new RegExp('(^|\\s)'+L+'\\s*[.)]\\s*').exec(seg.slice(p));
      if(!x)return;
      P.push([p+x.index+x[1].length,p+x.index+x[0].length]);p+=x.index+x[0].length;
    }
    const o=P.map((q,i)=>{
      let end=i<3?s+P[i+1][0]:e,a=s+q[1];
      while(a<end&&/\s/.test(T[a]))a++;
      const nl=T.indexOf('\n',a);if(nl>=0&&nl<end)end=nl;
      return{runs:mk(T,F,a,end),r:ratio(T,F,s+q[0],end)};
    });
    const rt=o.map(x=>x.r),n=rt.filter(x=>x>0).length,mx=Math.max(...rt);
    let ok=-1;
    if(n===1)ok=rt.findIndex(x=>x>0);
    else if(n>1&&mx>=.5&&rt.filter(x=>x===mx).length===1)ok=rt.indexOf(mx);
    out.push({
      stem:mk(T,F,s,s+P[0][0]),
      opts:o.map((x,i)=>({runs:(n===1&&i===ok)?x.runs.map(r=>({t:r.t,f:r.f&~1})):x.runs,ok:i===ok}))
    });
  });
  return out;
}

$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{styleMap:['u => u']});
    const {T,F}=flatten(r.value);
    const qs=parse(T,F);
    if(!qs.length){alert('Không nhận diện được câu hỏi nào. Hãy kiểm tra: câu bắt đầu bằng "Câu"/"Question" và có đủ 4 đáp án A, B, C, D.');return}
    orig=qs;name=f.name;code=0;cur=orig.map(q=>({...q}));
    $('shuf').disabled=$('exp').disabled=false;
    render();
    const miss=qs.filter(q=>!q.opts.some(o=>o.ok)).length;
    if(miss)alert(`Đã đọc ${qs.length} câu. Có ${miss} câu không tìm thấy đáp án gạch chân, vui lòng kiểm tra lại file gốc.`);
  }catch(err){alert('Lỗi đọc file: '+err.message)}
  e.target.value='';
};

/* ---------- Đảo đề ---------- */
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('shuf').onclick=()=>{
  cur=sh(orig).map(q=>({...q,opts:sh(q.opts)}));
  code++;render();window.scrollTo({top:0,behavior:'smooth'});
};

/* ---------- Hiển thị & chọn đáp án ---------- */
function rh(rs){
  return rs.map(r=>{
    let s=esc(r.t).replace(/\n/g,'<br>');
    if(r.f&1)s='<u>'+s+'</u>';if(r.f&2)s='<b>'+s+'</b>';if(r.f&4)s='<i>'+s+'</i>';
    return s;
  }).join('');
}
function render(){
  tries=0;
  $('list').innerHTML=cur.map((q,i)=>`<section class="q" id="q${i}">
    <div class="qh">Câu ${i+1}</div><div class="st">${rh(q.stem)}</div>
    <div class="os">${q.opts.map((o,j)=>`<button class="o" data-i="${i}" data-j="${j}"><span class="l">${'ABCD'[j]}</span><span>${rh(o.runs)}</span></button>`).join('')}</div>
    <div class="fb" id="fb${i}"></div></section>`).join('');
  upd();
}
function upd(){
  const n=cur.length,d=cur.filter(q=>q.done).length;
  $('info').innerHTML=n?`<b>${esc(name)}</b> • ${code?'Mã đề #'+code:'Đề gốc'} • ${n} câu • Đã đúng: <b>${d}/${n}</b> • Lượt chọn sai: <b>${tries}</b>${d===n?' • 🎉 Hoàn thành!':''}`
    :'Chưa có đề. Hãy bấm "Tải file Docx đề gốc" (câu hỏi bắt đầu bằng "Câu"/"Question", đáp án đúng được gạch chân).';
  $('pb').style.width=(n?d/n*100:0)+'%';
}
$('list').onclick=e=>{
  const b=e.target.closest('.o');if(!b||b.disabled)return;
  const i=+b.dataset.i,j=+b.dataset.j,q=cur[i],fb=$('fb'+i);
  if(!q.opts.some(o=>o.ok)){fb.className='fb warn';fb.textContent='⚠️ Câu này không tìm thấy đáp án gạch chân trong file gốc.';return}
  if(q.opts[j].ok){
    q.done=1;b.classList.add('ok');
    b.parentNode.querySelectorAll('.o').forEach(x=>x.disabled=true);
    fb.className='fb good';fb.textContent='✅ Chính xác!';
    upd();
    const nx=$('q'+(i+1));
    setTimeout(()=>(nx||$('q'+i)).scrollIntoView({behavior:'smooth',block:'center'}),800);
  }else{
    b.classList.add('bad');b.disabled=true;tries++;
    fb.className='fb no';fb.textContent='❌ Chưa đúng, hãy chọn lại!';
    upd();
  }
};

/* ---------- Xuất file Docx ---------- */
$('exp').onclick=async()=>{
  try{
    const D=docx,U={type:D.UnderlineType.SINGLE},P=[];
    const run=(r,u)=>r.t.split('\n').map((p,k)=>new D.TextRun({
      text:p,break:k?1:0,bold:!!(r.f&2),italics:!!(r.f&4),underline:(u||(r.f&1))?U:undefined}));
    P.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:240},
      children:[new D.TextRun({text:'ĐỀ TRẮC NGHIỆM – '+(code?'MÃ ĐỀ '+code:'ĐỀ GỐC'),bold:true,size:28})]}));
    cur.forEach((q,i)=>{
      P.push(new D.Paragraph({spacing:{before:200,after:60},
        children:[new D.TextRun({text:`Câu ${i+1}. `,bold:true}),...q.stem.flatMap(r=>run(r,false))]}));
      q.opts.forEach((o,j)=>P.push(new D.Paragraph({indent:{left:400},
        children:[
          new D.TextRun({text:'ABCD'[j]+'.',underline:o.ok?U:undefined}),
          new D.TextRun({text:' '}),
          ...o.runs.flatMap(r=>run(r,o.ok))
        ]})));
    });
    const doc=new D.Document({
      styles:{default:{document:{run:{font:'Times New Roman',size:26}}}},
      sections:[{children:P}]
    });
    const blob=await D.Packer.toBlob(doc);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`De_dao_${code?'ma_'+code:'goc'}.docx`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(err){alert('Lỗi xuất file: '+err.message)}
};

upd();
</script>
</body>
</html>
